# Sobe só o marketplace.web isolado — porta 3000 (ver README, seção
# "Portas", para o esquema completo da Aventura Organizada). 100%
# mockado (localStorage), não depende de nenhuma API rodando.
#
# Pra rodar a stack inteira junto (as 4 APIs + o backoffice.web), use o
# docker-compose.stack.yml deste mesmo repositório:
#   cp .env.example .env
#   docker compose -f docker-compose.stack.yml build --no-cache
#   docker compose -f docker-compose.stack.yml up
#
# docker compose up --build

services:
  greatgrandson-aventuraorganizada-marketplace-web:
    build: .
    image: greatgrandson-aventuraorganizada-marketplace-web
    container_name: greatgrandson-aventuraorganizada-marketplace-web-container
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
    ports:
      - "3000:3000"
    restart: unless-stopped
